<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLAY LUDU HUB</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div class="brand">🎲 PLAY LUDU HUB <span class="pill">v12</span></div><div class="row"><span id="who" class="muted"></span><button id="logout" class="secondary hidden">Logout</button></div></header>
<main class="wrap">
<section id="auth" class="auth grid"><div class="card span6"><h2>Login</h2><p class="muted">Approved accounts can sign in with username, phone or email.</p><form id="loginForm"><div class="field"><label>Username / phone / email</label><input name="login" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><br><button>Login</button></form></div><div class="card span6"><h2>Create account</h2><form id="signupForm"><div class="row"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Username</label><input name="username" required></div></div><div class="row"><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div></div><div class="field"><label>Password (10+ characters)</label><input name="password" type="password" minlength="10" required></div><br><button>Create pending account</button></form></div></section>
<section id="app" class="hidden"><div id="notice" class="notice hidden"></div><div class="grid">
<div class="card span8"><h2>Wallet</h2><div class="wallet"><div class="balance"><span class="muted">Cash</span><b id="cash">৳0</b></div><div class="balance"><span class="muted">Winnings</span><b id="wins">৳0</b></div><div class="balance"><span class="muted">Locked</span><b id="locked">৳0</b></div><div class="balance"><span class="muted">Bonus</span><b id="bonus">৳0</b></div></div></div>
<div class="card span4"><h3>Account</h3><div id="accountInfo" class="muted"></div><div class="row" style="margin-top:12px"><button id="selfExclude" class="danger">Self-exclude</button><button id="coolOff" class="secondary">24h cool-off</button></div></div>
<div class="card span6"><h2>Deposit</h2><form id="depositForm"><div class="field"><label>Merchant method</label><select name="method" id="depositMethod"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select></div><div id="depositNumbers" class="muted"></div><div class="row"><div class="field"><label>Amount (৳)</label><input name="amount" type="number" min="1" step="0.01" required></div><div class="field"><label>Transaction ID</label><input name="transactionId" required></div></div><br><button>Submit deposit</button></form><div id="depositHistory" class="list" style="margin-top:12px"></div></div>
<div class="card span6"><h2>Withdraw</h2><form id="withdrawForm"><div class="row"><div class="field"><label>Method</label><select name="method" id="withdrawMethod"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select></div><div class="field"><label>Source</label><select name="sourceBucket"><option value="winnings">Winnings</option><option value="cash">Cash (if enabled)</option><option value="bonus">Bonus (if enabled)</option></select></div></div><div class="row"><div class="field"><label>Account number</label><input name="accountNumber" required></div><div class="field"><label>Amount (৳)</label><input name="amount" type="number" min="1" step="0.01" required></div></div><br><button>Request payout</button></form><div id="withdrawHistory" class="list" style="margin-top:12px"></div></div>
<div class="card span12"><div class="row" style="justify-content:space-between"><div><h2>PvP Lobby</h2><div class="muted">Server-authoritative real-time matches.</div></div><button id="refreshLobby" class="secondary">Refresh</button></div><form id="createMatchForm" class="row" style="margin:12px 0"><div class="field"><label>Entry fee</label><input id="entryFee" name="entryFee" type="number" readonly></div><div class="field"><label>Bet amount</label><input name="betAmount" type="number" min="1" step="0.01" required></div><div style="align-self:end"><button>Create match</button></div></form><div id="lobby" class="list"></div></div>
</div></section></main><div id="toast" class="toast hidden"></div>
<script src="/app.js"></script><script src="/wallet.js"></script><script src="/pvp-lobby.js"></script></body></html>
